# Oracle fleet config - all mock upstreams wired, NO real credentials.
host: ""
port: 8397
remote-management:
  allow-remote: true
  secret-key: "$2a$10$22ixgJLGCPJD6mqcT8In8uLtq7nvCHnP.I279ahVk.67DruCKA2Yy"
  disable-control-panel: true
auth-dir: "/root/.cli-proxy-api"
api-keys:
  - "oracle-local-key-1"
debug: false
request-retry: 0
transient-error-cooldown-seconds: -1
usage-statistics-enabled: false
openai-compatibility:
  - name: "mock-openai"
    base-url: "http://host.docker.internal:20999/v1"
    api-key-entries:
      - api-key: "mock-upstream-key"
    models:
      - name: "mock-gpt-model"
        alias: "mock-model"
gemini-api-key:
  - api-key: "mock-gem-key"
    base-url: "http://host.docker.internal:21001"
    models:
      - name: "gemini-mock-model"
        alias: "gm"
claude-api-key:
  - api-key: "mock-claude-key"
    base-url: "http://host.docker.internal:21002"
    models:
      - name: "claude-mock-model"
        alias: "cm"
codex-api-key:
  - api-key: "mock-codex-key"
    base-url: "http://host.docker.internal:21003"
    models:
      - name: "gpt-mock-codex"
        alias: "cx"
xai-api-key:
  - api-key: "mock-xai-key"
    base-url: "http://host.docker.internal:21004"
    models:
      - name: "grok-mock"
        alias: "xg"
meta-api-key:
  - api-key: "mock-meta-key"
    base-url: "http://host.docker.internal:21005"
    models:
      - name: "muse-mock"
        alias: "mm"
interactions-api-key:
  - api-key: "mock-int-key"
    base-url: "http://host.docker.internal:21006"
    models:
      - name: "gemini-mock-model"
        alias: "im"
vertex-api-key:
  - api-key: "mock-vertex-key"
    base-url: "http://host.docker.internal:21007"
    models:
      - name: "vertex-mock-model"
        alias: "vm"
plugins:
  enabled: true
  dir: "plugins"
  configs: {}
credential-concurrency:
  cpa-heartbeat-timeout: 3s
  cpa-cancel-bound: 5s
  reclaim-grace: 5s
  cleanup-interval: 5s
  release-flush-interval: 250ms
  release-max-backoff: 2s
  busy-retry-min: 250ms
  busy-retry-max: 1s
  max-limit: 1000000
credential-in-flight:
  snapshot-interval: 2s
  stale-after: 10s
  max-part-bytes: 262144
  max-part-count: 64
  max-revision-bytes: 16777216
  max-aggregate-groups: 100000
  max-details: 10000
  max-string-bytes: 256
  staging-retention: 1m
discovery:
  service-type: _ai-gateway._tcp
  subtypes:
    - _chat-completions
    - _responses
    - _messages
    - _generate-content
    - _interactions
redis-usage-queue-retention-seconds: 60
ws-auth: true
